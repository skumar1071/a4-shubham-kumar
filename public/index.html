<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Log in to Workout Tracker to record and manage your exercises."
  >

  <title>Workout Tracker Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>

<body class="bg-light">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">

            <h1 class="h2 mb-3">Workout Tracker</h1>
            <p class="text-muted">Log in to access your workouts.</p>

            <!-- GitHub login -->
            <a href="/auth/github" class="btn btn-dark w-100 mb-3">
              Continue with GitHub
            </a>

            <div class="text-center text-muted mb-3">or</div>

            <!-- Username/password login -->
            <p class="text-muted">
              Log in with your existing Workout Tracker account.
              If your username does not already exist, a new account will automatically be created.
            </p>

            <div id="login-error" class="alert alert-danger d-none" role="alert">
              Incorrect password. Please try again.
            </div>

            <form action="/login" method="POST">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  class="form-control"
                  autocomplete="username"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  autocomplete="current-password"
                  required
                >
              </div>

              <button type="submit" class="btn btn-primary w-100">Log In</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams( window.location.search )

    if( params.get( 'loginFailed' ) === 'true' ) {
      document.querySelector( '#login-error' ).classList.remove( 'd-none' )
    }
  </script>

</body>
</html>
